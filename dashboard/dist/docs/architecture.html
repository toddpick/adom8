2) SQS-triggered agent Lambdas

PlanningAgentFunction

Usually enqueued by: OrchestratorWebhookFunction
File refs:

/tmp/workspace/toddpick/adom8-aws/infra/modules/lambda/main.tf
/tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Api/OrchestratorWebhookFunction.cs
CodingAgentFunction
Actual trigger: SQS message with AgentType = CodingAgent
Usually enqueued by: PlanningAgentService
Also enqueued by: CopilotTimeoutChecker for fallback-to-agentic coding
Files:

/tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Agents/PlanningAgentService.cs
/tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Workers/CopilotTimeoutChecker.cs
TestingAgentFunction
Actual trigger: SQS message with AgentType = TestingAgent
Usually enqueued by: CodingAgentService (agentic path)
Also enqueued by: CopilotBridgeWebhookFunction when Copilot completes
Files:

/tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Agents/CodingAgentService.cs
/tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Webhooks/CopilotBridgeWebhook.cs
ReviewAgentFunction
Actual trigger: SQS message with AgentType = ReviewAgent
Enqueued by: TestingAgentService
File: /tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Agents/TestingAgentService.cs

DocumentationAgentFunction
Actual trigger: SQS message with AgentType = DocumentationAgent
Enqueued by: ReviewAgentService
File: /tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Agents/ReviewAgentService.cs

DeploymentAgentFunction
Actual trigger: SQS message with AgentType = DeploymentAgent
Enqueued by: DocumentationAgentService
File: /tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Agents/DocumentationAgentService.cs

Important detail: the SQS attribute is set in /tmp/workspace/toddpick/adom8-aws/src/AdomAWS/Shared/Services/SqsAgentTaskQueue.cs, and the Lambda-side SQS filter is in /tmp/workspace/toddpick/adom8-aws/infra/modules/lambda/main.tf.

3) EventBridge Scheduler–triggered worker Lambdas
These are defined in /tmp/workspace/toddpick/adom8-aws/infra/modules/eventbridge/main.tf.

DeadLetterQueueHandler
Actual trigger: EventBridge Scheduler
Schedule: every 5 minutes
Purpose: polls the DLQ and handles permanently failed messages

CopilotTimeoutChecker
Actual trigger: EventBridge Scheduler
Schedule: every 15 minutes
Purpose: finds timed-out Copilot delegations and re-enqueues Coding

AgentTaskDispatcher
Actual trigger: EventBridge Scheduler
Schedule: every 1 minute
Important nuance: despite the name, comments say this is mainly a secondary health/manual safety-net. Normal agent execution is primarily SQS → Lambda, not this scheduler.

4) End-to-end pipeline trigger flow
The main trigger chain is:

Azure DevOps Service Hook
→ API Gateway POST /webhook
→ OrchestratorWebhookFunction

OrchestratorWebhookFunction
→ sends SQS message for PlanningAgentFunction

PlanningAgentFunction
→ may enqueue CodingAgentFunction

CodingAgentFunction

Agentic path: enqueue TestingAgentFunction
Copilot path: wait for GitHub webhook to hit /copilot-bridge
CopilotBridgeWebhookFunction
→ enqueue TestingAgentFunction

TestingAgentFunction
→ enqueue ReviewAgentFunction

ReviewAgentFunction
→ enqueue DocumentationAgentFunction

DocumentationAgentFunction
→ enqueue DeploymentAgentFunction`;

// ── SVG helpers ────────────────────────────────────────────────────────────────
function el(tag, attrs) {
  const e = document.createElementNS(ns, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  return e;
}
function tx(content, attrs) {
  const t = el('text', attrs);
  t.textContent = content;
  return t;
}

function edgePath(data, e) {
  const f = data.nodes.find(function(n){ return n.id===e.f; });
  const t = data.nodes.find(function(n){ return n.id===e.t; });
  const fW2=f.w/2, fH2=f.h/2, tW2=t.w/2, tH2=t.h/2;
  if (e.loopLeft) {
    const rail = data.loopRail;
    return 'M '+(f.cx-fW2)+' '+f.cy+' L '+rail+' '+f.cy+' L '+rail+' '+t.cy+' L '+(t.cx-tW2)+' '+t.cy;
  }
  const dx=t.cx-f.cx, dy=t.cy-f.cy;
  let x1,y1,x2,y2;
  if (Math.abs(dx) >= Math.abs(dy)) {
    x1=f.cx+(dx>0?fW2:-fW2); y1=f.cy;
    x2=t.cx+(dx>0?-tW2:tW2); y2=t.cy;
  } else {
    x1=f.cx; y1=f.cy+(dy>0?fH2:-fH2);
    x2=t.cx; y2=t.cy+(dy>0?-tH2:tH2);
  }
  const c1x=x1+(x2-x1)*0.45, c2x=x1+(x2-x1)*0.55;
  return 'M '+x1+' '+y1+' C '+c1x+' '+y1+', '+c2x+' '+y2+', '+x2+' '+y2;
}

function buildSVG(data) {
  const svg = el('svg', { width:data.svgW, height:data.svgH, viewBox:'0 0 '+data.svgW+' '+data.svgH });

  const defs = el('defs', {});
  [['arr','#94a3b8'],['arr-d','#f97316'],['arr-b','#3b82f6']].forEach(function(pair) {
    const m = el('marker',{ id:pair[0], viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse' });
    m.appendChild(el('path',{ d:'M 0 1 L 9 5 L 0 9 z', fill:pair[1] }));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  const br = data.boundaryRect;
  svg.appendChild(el('rect',{ x:br.x, y:br.y, width:br.w, height:br.h, rx:'12', fill:'#080d1a', stroke:data.boundaryColor, 'stroke-width':'2' }));
  svg.appendChild(tx(data.boundaryLabel, { x:br.x+10, y:br.y+22, fill:data.boundaryColor, 'font-size':'11', 'font-family':'Segoe UI,sans-serif', 'font-weight':'600' }));

  data.groups.forEach(function(g) {
    const attrs = { x:g.x, y:g.y, width:g.w, height:g.h, rx:'8',
      fill: g.azure ? '#0a1628' : '#0d1424',
      stroke: g.azure ? '#0078d466' : '#1e293b',
      'stroke-width': g.azure ? '1.5' : '1' };
    svg.appendChild(el('rect', attrs));
    svg.appendChild(tx(g.label, {
      x:g.x+8, y:g.y+14,
      fill: g.azure ? '#0078d4aa' : '#475569',
      'font-size':'10',
      'font-weight': g.azure ? '600' : '400',
      'font-family':'Segoe UI,sans-serif'
    }));
  });

  data.edges.forEach(function(e) {
    const d = !!e.dashed;
    svg.appendChild(el('path',{
      d: edgePath(data,e), fill:'none',
      stroke: d ? '#f9731655' : '#47556977',
      'stroke-width':'1.5',
      'marker-end': d ? 'url(#arr-d)' : 'url(#arr)',
      'stroke-dasharray': d ? '5 3' : '0'
    }));
    if (e.label) {
      const fn = data.nodes.find(function(n){ return n.id===e.f; });
      const tn = data.nodes.find(function(n){ return n.id===e.t; });
      const mx=(fn.cx+tn.cx)/2, my=(fn.cy+tn.cy)/2;
      const lines = e.label.split('\n');
      lines.forEach(function(line,i) {
        svg.appendChild(tx(line,{
          x:mx, y: my-(lines.length-1)*7+i*14,
          'text-anchor':'middle',
          fill: d ? '#f9731688' : '#64748b',
          'font-size':'9', 'font-family':'Segoe UI,sans-serif'
        }));
      });
    }
  });

  data.nodes.forEach(function(n) {
    const s = STYLES[n.type];
    const attrs = { x:n.cx-n.w/2, y:n.cy-n.h/2, width:n.w, height:n.h, rx:'7', fill:s.fill, stroke:s.stroke, 'stroke-width':'2' };
    if (s.dash) attrs['stroke-dasharray'] = '6 3';
    svg.appendChild(el('rect', attrs));
    const lh=16, total=n.lines.length;
    n.lines.forEach(function(line,i) {
      const sy = n.cy - (total-1)*lh/2;
      svg.appendChild(tx(line,{
        x:n.cx, y: sy+i*lh+4,
        'text-anchor':'middle', 'dominant-baseline':'middle',
        fill:s.text,
        'font-size': (i===0 && total>1) ? '12' : '10',
        'font-weight': i===0 ? '600' : '400',
        'font-family':'Segoe UI,sans-serif'
      }));
    });
  });

  return svg;
}

// ── Pan / zoom ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const mover  = document.getElementById('mover');
const triggersModal = document.getElementById('triggers-modal');
const triggerGuideContent = document.getElementById('triggers-content');
let scale=1, panX=0, panY=0, curData=AWS;
triggerGuideContent.textContent = TRIGGER_GUIDE_TEXT;

function applyT() {
  mover.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+scale+')';
  document.getElementById('zoom-pct').textContent = Math.round(scale*100)+'%';
}
function fit() {
  const s = Math.min(canvas.clientWidth/curData.svgW, canvas.clientHeight/curData.svgH)*0.96;
  scale=s; panX=(canvas.clientWidth-curData.svgW*s)/2; panY=(canvas.clientHeight-curData.svgH*s)/2; applyT();
}

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  const r=canvas.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const ns2=Math.max(0.04,Math.min(20,scale*(e.deltaY<0?1.13:0.885)));
  panX=mx-(mx-panX)*(ns2/scale); panY=my-(my-panY)*(ns2/scale); scale=ns2; applyT();
},{ passive:false });

var drag=false,sx=0,sy=0;
canvas.addEventListener('mousedown',function(e){ drag=true; sx=e.clientX-panX; sy=e.clientY-panY; canvas.classList.add('dragging'); e.preventDefault(); });
document.addEventListener('mousemove',function(e){ if(!drag)return; panX=e.clientX-sx; panY=e.clientY-sy; applyT(); });
document.addEventListener('mouseup',function(){ drag=false; canvas.classList.remove('dragging'); });

function zC(f){ var mx=canvas.clientWidth/2,my=canvas.clientHeight/2,ns2=Math.max(0.04,Math.min(20,scale*f)); panX=mx-(mx-panX)*(ns2/scale); panY=my-(my-panY)*(ns2/scale); scale=ns2; applyT(); }
document.getElementById('btn-in').addEventListener('click',function(){ zC(1.3); });
document.getElementById('btn-out').addEventListener('click',function(){ zC(0.77); });
document.getElementById('btn-fit').addEventListener('click',fit);
document.getElementById('btn-triggers').addEventListener('click', function() {
  triggersModal.classList.add('open');
  triggersModal.setAttribute('aria-hidden', 'false');
});
document.getElementById('btn-close-triggers').addEventListener('click', function() {
  triggersModal.classList.remove('open');
  triggersModal.setAttribute('aria-hidden', 'true');
});
triggersModal.addEventListener('click', function(e) {
  if (e.target === triggersModal) {
    triggersModal.classList.remove('open');
    triggersModal.setAttribute('aria-hidden', 'true');
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && triggersModal.classList.contains('open')) {
    triggersModal.classList.remove('open');
    triggersModal.setAttribute('aria-hidden', 'true');
  }
});
window.addEventListener('resize',fit);

function switchTo(data, key) {
  curData = data;
  while (mover.firstChild) mover.removeChild(mover.firstChild);
  mover.appendChild(buildSVG(data));
  document.getElementById('tog-aws').classList.toggle('active',   key==='aws');
  document.getElementById('tog-azure').classList.toggle('active', key==='azure');
  canvas.classList.toggle('aws-bg',   key==='aws');
  canvas.classList.toggle('azure-bg', key==='azure');
  document.getElementById('hdr-sub').textContent   = data.subTitle;
  document.getElementById('leg-db').textContent    = data.dbChipLabel;
  document.getElementById('leg-q').textContent     = data.queueChipLabel;
  document.getElementById('pg-footer').textContent = data.footer;
  fit();
}

switchTo(AWS, 'aws');
