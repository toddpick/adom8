trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  # The following variables must be provided by the user when running the pipeline:
  # - ONBOARDING_PAT (secret)
  # - AZURE_SUBSCRIPTION_ID
  # - AZURE_DEVOPS_ORG (Must be the full URL, e.g., https://dev.azure.com/yourorg)
  # - AZURE_DEVOPS_PROJECT
  # - GITHUB_ORG
  # - GITHUB_REPO
  # - CLAUDE_API_KEY (secret)  ← Anthropic; provide this OR OPENAI_API_KEY (at least one required)
  # - OPENAI_API_KEY (secret)   ← OpenAI; used as primary if CLAUDE_API_KEY is not set
  # - RESOURCE_GROUP_NAME
  # - LOCATION
  # - STATIC_WEB_APP_LOCATION (optional; defaults to LOCATION)
  # - SHARED_SERVICE_BUS_RESOURCE_GROUP_NAME
  # - SHARED_SERVICE_BUS_NAMESPACE_NAME
  # - SHARED_SERVICE_BUS_LOCATION
  # - GITHUB_TOKEN (secret)      ← must have 'repo' scope (read + write secrets)
  # - AZURE_SERVICE_CONNECTION
  # - AdoDashboardKey (secret)
  # - COPILOT_ENABLED (optional; defaults to true)
  # - COPILOT_MCP_AZURE_DEVOPS_PAT (optional secret; enables ADO MCP PAT auth template + repo secret sync)
  # - GITHUB_BASE_BRANCH (optional; leave blank to use the repository default branch)

  # Resource names are derived at runtime from RESOURCE_GROUP_NAME so they are
  # stable across re-runs — same group name always produces the same suffix.
  # These placeholders are overwritten by the 'Compute Resource Names' step.
  FUNCTION_APP_NAME: 'adom8-func-placeholder'
  STORAGE_ACCOUNT_NAME: 'adom8stplaceholder'
  KEY_VAULT_NAME: 'adom8-kv-placeholder'
  STATIC_WEB_APP_LOCATION: 'eastus2'
  SHARED_SERVICE_BUS_RESOURCE_GROUP_NAME: ''
  SHARED_SERVICE_BUS_NAMESPACE_NAME: ''
  SHARED_SERVICE_BUS_LOCATION: ''
  COPILOT_ENABLED: 'true'
  COPILOT_MODE: 'Auto'
  COPILOT_COMPLEXITY_THRESHOLD: '8'
  COPILOT_CREATE_ISSUE: 'true'
  COPILOT_MODEL: 'copilot'
  COPILOT_WEBHOOK_SECRET: ''
  COPILOT_CHECKPOINT_ENFORCEMENT_ENABLED: 'true'
  COPILOT_CHECKPOINT_FAIL_HARD: 'true'
  COPILOT_REQUIRED_ADO_CHECKPOINTS: 'LastAgent,AICurrentAgent,CompletionComment'
  GITHUB_BASE_BRANCH: ''
  REPO_CAPACITY_ENABLED: 'true'
  REPO_CAPACITY_MAX_WORKING_TREE_MB: '500'
  REPO_CAPACITY_MAX_BINARY_MB: '150'
  REPO_CAPACITY_MAX_FILE_COUNT: '120000'
  REPO_CAPACITY_BLOCK_TRUNCATED_TREE: 'true'
  CODEBASE_API_ONLY_INIT: 'true'
  CODEBASE_API_FILE_LIMIT_KB: '100'
  CODEBASE_API_PUBLISH_ENABLED: 'true'
  MCP_BOOTSTRAP_ENABLED: 'true'
  COPILOT_MCP_AZURE_DEVOPS_PAT: ''

stages:
- stage: Infrastructure
  displayName: 'Stage 1: Azure Infrastructure'
  jobs:
  - job: DeployInfra
    displayName: 'Deploy Azure Resources'
    steps:
    - task: AzureCLI@2
      displayName: 'Create Resource Group, Storage, Key Vault, and Function App'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          # Compute stable 8-char suffix from resource group name so resource
          # names are identical on every re-run (idempotent).
          SUFFIX=$(echo -n "$(RESOURCE_GROUP_NAME)" | sha256sum | cut -c1-8)
          ADO_PROJECT_NAME="$(System.TeamProject)"
          if [ -z "$ADO_PROJECT_NAME" ] || [ "$ADO_PROJECT_NAME" = "null" ]; then
            ADO_PROJECT_NAME="$(AZURE_DEVOPS_PROJECT)"
          fi
          PROJECT_SLUG=$(echo "$ADO_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$PROJECT_SLUG" ]; then PROJECT_SLUG="adom8"; fi
          SWA_BASE=$(echo "$PROJECT_SLUG" | cut -c1-35)
          FUNCTION_APP_NAME="adom8-func-${SUFFIX}"
          STORAGE_ACCOUNT_NAME="adom8st${SUFFIX}"
          KEY_VAULT_NAME="adom8-kv-${SUFFIX}"
          SWA_NAME="${SWA_BASE}-${SUFFIX}"
          SERVICE_BUS_TOPIC_NAME="adom8-${PROJECT_SLUG}"
          SERVICE_BUS_SUBSCRIPTION_NAME="adom8-agent"
          echo "Using ADO-project-derived Static Web App name: $SWA_NAME"
          echo "##vso[task.setvariable variable=FUNCTION_APP_NAME]$FUNCTION_APP_NAME"
          echo "##vso[task.setvariable variable=STORAGE_ACCOUNT_NAME]$STORAGE_ACCOUNT_NAME"
          echo "##vso[task.setvariable variable=KEY_VAULT_NAME]$KEY_VAULT_NAME"
          echo "##vso[task.setvariable variable=SWA_NAME]$SWA_NAME"
          echo "##vso[task.setvariable variable=SERVICE_BUS_TOPIC_NAME]$SERVICE_BUS_TOPIC_NAME"
          echo "##vso[task.setvariable variable=SERVICE_BUS_SUBSCRIPTION_NAME]$SERVICE_BUS_SUBSCRIPTION_NAME"
          echo "Resource names: FuncApp=$FUNCTION_APP_NAME | Storage=$STORAGE_ACCOUNT_NAME | KV=$KEY_VAULT_NAME | SWA=$SWA_NAME | SB Topic=$SERVICE_BUS_TOPIC_NAME | SB Sub=$SERVICE_BUS_SUBSCRIPTION_NAME"

          echo "Creating Resource Group: $(RESOURCE_GROUP_NAME) in $(LOCATION)"
          az group create --name $(RESOURCE_GROUP_NAME) --location $(LOCATION)

          echo "Creating Storage Account: $STORAGE_ACCOUNT_NAME"
          az storage account show --name $STORAGE_ACCOUNT_NAME --resource-group $(RESOURCE_GROUP_NAME) 2>/dev/null || \
            az storage account create --name $STORAGE_ACCOUNT_NAME --resource-group $(RESOURCE_GROUP_NAME) --location $(LOCATION) --sku Standard_LRS

          echo "Creating Key Vault: $KEY_VAULT_NAME"
          az keyvault show --name $KEY_VAULT_NAME --resource-group $(RESOURCE_GROUP_NAME) 2>/dev/null || \
            az keyvault create --name $KEY_VAULT_NAME --resource-group $(RESOURCE_GROUP_NAME) --location $(LOCATION) --enable-rbac-authorization false

          echo "Ensuring Windows Consumption Function App: $FUNCTION_APP_NAME"
          if az functionapp show --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) >/dev/null 2>&1; then
            IS_LINUX=$(az functionapp show --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --query "reserved" -o tsv)
            if [ "$IS_LINUX" = "true" ]; then
              echo "Existing app is Linux. Recreating as Windows Consumption (Y1-compatible)."
              az functionapp delete --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME)
            else
              echo "Existing app is Windows-compatible. Reusing app."
            fi
          fi

          az functionapp show --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) >/dev/null 2>&1 || \
            az functionapp create --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --storage-account $STORAGE_ACCOUNT_NAME --consumption-plan-location $(LOCATION) --functions-version 4 --os-type Windows --runtime dotnet-isolated --runtime-version 8.0

          SWA_LOCATION="$(STATIC_WEB_APP_LOCATION)"
          if [ -z "$SWA_LOCATION" ] || [ "$SWA_LOCATION" = "null" ]; then
            SWA_LOCATION="$(LOCATION)"
          fi

          echo "Creating Static Web App: $SWA_NAME in $SWA_LOCATION"
          az staticwebapp show --name $SWA_NAME --resource-group $(RESOURCE_GROUP_NAME) 2>/dev/null || \
            az staticwebapp create --name $SWA_NAME --resource-group $(RESOURCE_GROUP_NAME) --location "$SWA_LOCATION" --sku Free

          echo "Validating Static Web App exists"
          az staticwebapp show --name $SWA_NAME --resource-group $(RESOURCE_GROUP_NAME) >/dev/null

          echo "Retrieving Static Web App hostname and adding CORS to Function App"
          SWA_HOSTNAME=$(az staticwebapp show --name $SWA_NAME --resource-group $(RESOURCE_GROUP_NAME) --query "defaultHostname" -o tsv)
          if [ -z "$SWA_HOSTNAME" ] || [ "$SWA_HOSTNAME" = "null" ]; then
            echo "ERROR: Static Web App hostname is empty."
            exit 1
          fi
          FUNCTION_APP_HOSTNAME="https://${FUNCTION_APP_NAME}.azurewebsites.net"
          echo "##vso[task.setvariable variable=FUNCTION_APP_HOSTNAME]$FUNCTION_APP_HOSTNAME"
          az functionapp cors add --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --allowed-origins "https://$SWA_HOSTNAME"

          echo "Adding CORS for any additional Static Web Apps in resource group"
          ALL_SWA_HOSTNAMES=$(az staticwebapp list --resource-group $(RESOURCE_GROUP_NAME) --query "[].defaultHostname" -o tsv)
          for hostname in $ALL_SWA_HOSTNAMES; do
            if [ -n "$hostname" ] && [ "$hostname" != "$SWA_HOSTNAME" ]; then
              echo "Adding CORS for extra SWA: https://$hostname"
              az functionapp cors add --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --allowed-origins "https://$hostname"
            fi
          done

          echo "Retrieving Static Web App deployment token"
          SWA_TOKEN=$(az staticwebapp secrets list --name $SWA_NAME --resource-group $(RESOURCE_GROUP_NAME) --query "properties.apiKey" -o tsv)
          if [ -z "$SWA_TOKEN" ] || [ "$SWA_TOKEN" = "null" ]; then
            echo "ERROR: Static Web App deployment token is empty."
            exit 1
          fi
          echo "##vso[task.setvariable variable=SWA_TOKEN;issecret=true]$SWA_TOKEN"
          echo "##vso[task.setvariable variable=STATIC_WEB_APP_API_KEY;issecret=true]$SWA_TOKEN"

          echo "Enabling Managed Identity for Function App"
          PRINCIPAL_ID=$(az functionapp identity assign --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --query principalId -o tsv)

          echo "Setting Key Vault access policy for Function App"
          az keyvault set-policy --name $KEY_VAULT_NAME --object-id $PRINCIPAL_ID --secret-permissions get list set

          echo "##vso[task.setvariable variable=FUNCTION_PRINCIPAL_ID]$PRINCIPAL_ID"

    - task: AzureCLI@2
      displayName: 'Create or Reuse Shared Service Bus Resources'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          if [ -z "$(SHARED_SERVICE_BUS_RESOURCE_GROUP_NAME)" ] || [ -z "$(SHARED_SERVICE_BUS_NAMESPACE_NAME)" ] || [ -z "$(SHARED_SERVICE_BUS_LOCATION)" ]; then
            echo "ERROR: SHARED_SERVICE_BUS_RESOURCE_GROUP_NAME, SHARED_SERVICE_BUS_NAMESPACE_NAME, and SHARED_SERVICE_BUS_LOCATION are required."
            exit 1
          fi

          ADO_PROJECT_NAME="$(System.TeamProject)"
          if [ -z "$ADO_PROJECT_NAME" ] || [ "$ADO_PROJECT_NAME" = "null" ]; then
            ADO_PROJECT_NAME="$(AZURE_DEVOPS_PROJECT)"
          fi
          PROJECT_SLUG=$(echo "$ADO_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$PROJECT_SLUG" ]; then PROJECT_SLUG="adom8"; fi

          PRINCIPAL_ID="$(FUNCTION_PRINCIPAL_ID)"
          SERVICE_BUS_RESOURCE_GROUP_NAME="$(SHARED_SERVICE_BUS_RESOURCE_GROUP_NAME)"
          SERVICE_BUS_NAMESPACE_NAME="$(SHARED_SERVICE_BUS_NAMESPACE_NAME)"
          SERVICE_BUS_LOCATION="$(SHARED_SERVICE_BUS_LOCATION)"
          SERVICE_BUS_TOPIC_NAME="adom8-${PROJECT_SLUG}"
          SERVICE_BUS_SUBSCRIPTION_NAME="adom8-agent"
          SERVICE_BUS_NAMESPACE_FQDN="${SERVICE_BUS_NAMESPACE_NAME}.servicebus.windows.net"

          echo "Ensuring shared Service Bus resource group exists: $SERVICE_BUS_RESOURCE_GROUP_NAME"
          az group create --name "$SERVICE_BUS_RESOURCE_GROUP_NAME" --location "$SERVICE_BUS_LOCATION" >/dev/null

          echo "Ensuring shared Service Bus namespace exists: $SERVICE_BUS_NAMESPACE_NAME"
          if az servicebus namespace show --name "$SERVICE_BUS_NAMESPACE_NAME" --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" >/dev/null 2>&1; then
            echo "Shared Service Bus namespace already exists. Reusing it."
          else
            if az servicebus namespace create --name "$SERVICE_BUS_NAMESPACE_NAME" --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" --location "$SERVICE_BUS_LOCATION" --sku Standard >/dev/null; then
              echo "Shared Service Bus namespace created."
            else
              echo "Namespace create returned a non-zero exit code. Rechecking in case it was created concurrently."
              if az servicebus namespace show --name "$SERVICE_BUS_NAMESPACE_NAME" --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" >/dev/null 2>&1; then
                echo "Shared Service Bus namespace was created concurrently. Reusing it."
              else
                echo "ERROR: Failed to create or locate Service Bus namespace '$SERVICE_BUS_NAMESPACE_NAME' in resource group '$SERVICE_BUS_RESOURCE_GROUP_NAME'."
                az resource list --name "$SERVICE_BUS_NAMESPACE_NAME" --resource-type "Microsoft.ServiceBus/namespaces" -o table || true
                exit 1
              fi
            fi
          fi

          echo "Ensuring project topic exists: $SERVICE_BUS_TOPIC_NAME"
          az servicebus topic show \
            --name "$SERVICE_BUS_TOPIC_NAME" \
            --namespace-name "$SERVICE_BUS_NAMESPACE_NAME" \
            --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" >/dev/null 2>&1 || \
          az servicebus topic create \
            --name "$SERVICE_BUS_TOPIC_NAME" \
            --namespace-name "$SERVICE_BUS_NAMESPACE_NAME" \
            --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" >/dev/null

          echo "Ensuring project subscription exists: $SERVICE_BUS_SUBSCRIPTION_NAME"
          az servicebus topic subscription show \
            --name "$SERVICE_BUS_SUBSCRIPTION_NAME" \
            --namespace-name "$SERVICE_BUS_NAMESPACE_NAME" \
            --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" \
            --topic-name "$SERVICE_BUS_TOPIC_NAME" >/dev/null 2>&1 || \
          az servicebus topic subscription create \
            --name "$SERVICE_BUS_SUBSCRIPTION_NAME" \
            --namespace-name "$SERVICE_BUS_NAMESPACE_NAME" \
            --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" \
            --topic-name "$SERVICE_BUS_TOPIC_NAME" >/dev/null

          SERVICE_BUS_SUBSCRIPTION_ID=$(az servicebus topic subscription show \
            --name "$SERVICE_BUS_SUBSCRIPTION_NAME" \
            --namespace-name "$SERVICE_BUS_NAMESPACE_NAME" \
            --resource-group "$SERVICE_BUS_RESOURCE_GROUP_NAME" \
            --topic-name "$SERVICE_BUS_TOPIC_NAME" \
            --query id -o tsv)

          echo "Ensuring Function App managed identity can receive from $SERVICE_BUS_SUBSCRIPTION_ID"
          EXISTING_ASSIGNMENT_COUNT=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$SERVICE_BUS_SUBSCRIPTION_ID" \
            --query "[?roleDefinitionName=='Azure Service Bus Data Receiver'] | length(@)" -o tsv)

          if [ -z "$EXISTING_ASSIGNMENT_COUNT" ] || [ "$EXISTING_ASSIGNMENT_COUNT" = "0" ]; then
            role_assignment_created="false"
            for attempt in {1..12}; do
              if az role assignment create \
                --assignee-object-id "$PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --role "Azure Service Bus Data Receiver" \
                --scope "$SERVICE_BUS_SUBSCRIPTION_ID" >/dev/null 2>&1; then
                role_assignment_created="true"
                echo "Azure Service Bus Data Receiver role assignment created."
                break
              fi

              echo "Role assignment not ready yet (attempt $attempt/12). Waiting 10 seconds for managed identity propagation."
              sleep 10
            done

            if [ "$role_assignment_created" != "true" ]; then
              echo "ERROR: Failed to create Azure Service Bus Data Receiver role assignment after waiting for managed identity propagation."
              exit 1
            fi
          else
            echo "Azure Service Bus Data Receiver role assignment already exists."
          fi

          echo "##vso[task.setvariable variable=SERVICE_BUS_NAMESPACE_FQDN]$SERVICE_BUS_NAMESPACE_FQDN"
          echo "##vso[task.setvariable variable=SERVICE_BUS_TOPIC_NAME]$SERVICE_BUS_TOPIC_NAME"
          echo "##vso[task.setvariable variable=SERVICE_BUS_SUBSCRIPTION_NAME]$SERVICE_BUS_SUBSCRIPTION_NAME"

    - task: DotNetCoreCLI@2
      displayName: 'Build Azure Function'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/AIAgents.Functions/AIAgents.Functions.csproj'
        arguments: '--configuration Release --output $(System.DefaultWorkingDirectory)/publish_output'
        zipAfterPublish: true

    - task: AzureFunctionApp@2
      displayName: 'Deploy Azure Function'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        appType: 'functionApp'
        appName: '$(FUNCTION_APP_NAME)'
        package: '$(System.DefaultWorkingDirectory)/publish_output/**/*.zip'

    - task: AzureCLI@2
      displayName: 'Validate Function Host Discovery'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          FUNCTION_APP_NAME="$(FUNCTION_APP_NAME)"
          RESOURCE_GROUP_NAME="$(RESOURCE_GROUP_NAME)"
          FUNCTION_URL="https://${FUNCTION_APP_NAME}.azurewebsites.net/api/health"

          echo "Waiting for functions to be indexed..."
          indexed=""
          for i in {1..18}; do
            indexed=$(az functionapp function list --name "$FUNCTION_APP_NAME" --resource-group "$RESOURCE_GROUP_NAME" --query "length(@)" -o tsv || echo "0")
            echo "Attempt $i: indexed functions = ${indexed}"
            if [ "${indexed}" != "0" ] && [ -n "${indexed}" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "${indexed}" ] || [ "${indexed}" = "0" ]; then
            echo "ERROR: No functions were indexed after deployment."
            exit 1
          fi

          echo "Checking health endpoint: ${FUNCTION_URL}"
          health_code=$(curl -sS -o /dev/null -w "%{http_code}" "$FUNCTION_URL" || true)
          echo "Health endpoint HTTP ${health_code}"
          # 200 = healthy, 503 = app running but not yet configured (secrets set in Stage 2) — both are valid here.
          # 404 means the host never loaded functions; anything else is an unexpected failure.
          if [ "$health_code" = "404" ] || [ -z "$health_code" ]; then
            echo "ERROR: Health endpoint returned 404 — functions not loaded by host."
            exit 1
          fi
          echo "Host is responding (HTTP ${health_code}). Full health verified after Stage 2 configuration."

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js 20'

    - script: |
        cd dashboard
        npm ci
      displayName: 'Install dashboard dependencies'

    - script: |
        cd dashboard
        npm run build
      displayName: 'Build React dashboard'
      env:
        VITE_API_BASE_URL: $(FUNCTION_APP_HOSTNAME)

    - task: AzureStaticWebApp@0
      displayName: 'Deploy dashboard to Static Web App'
      inputs:
        azure_static_web_apps_api_token: $(STATIC_WEB_APP_API_KEY)
        app_location: 'dashboard/dist'
        skip_app_build: true

- stage: Configuration
  displayName: 'Stages 2-7: Configuration and Validation'
  dependsOn: Infrastructure
  jobs:
  - job: RunSetupScript
    displayName: 'Run Setup Script'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        pip install requests azure-identity azure-keyvault-secrets azure-mgmt-resource
      displayName: 'Install Python Dependencies'

    - task: AzureCLI@2
      displayName: 'Run Python Setup Script'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          # Recompute stable resource names (same logic as Stage 1)
          SUFFIX=$(echo -n "$(RESOURCE_GROUP_NAME)" | sha256sum | cut -c1-8)
          FUNCTION_APP_NAME="adom8-func-${SUFFIX}"
          KEY_VAULT_NAME="adom8-kv-${SUFFIX}"
          ADO_PROJECT_NAME="$(System.TeamProject)"
          if [ -z "$ADO_PROJECT_NAME" ] || [ "$ADO_PROJECT_NAME" = "null" ]; then
            ADO_PROJECT_NAME="$(AZURE_DEVOPS_PROJECT)"
          fi
          PROJECT_SLUG=$(echo "$ADO_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$PROJECT_SLUG" ]; then PROJECT_SLUG="adom8"; fi
          SERVICE_BUS_NAMESPACE_FQDN="$(SHARED_SERVICE_BUS_NAMESPACE_NAME).servicebus.windows.net"
          SERVICE_BUS_TOPIC_NAME="adom8-${PROJECT_SLUG}"
          SERVICE_BUS_SUBSCRIPTION_NAME="adom8-agent"
          echo "Using FuncApp=$FUNCTION_APP_NAME | KV=$KEY_VAULT_NAME"

          echo "Creating Function App Key for Dashboard"
          az functionapp keys set --name $FUNCTION_APP_NAME --resource-group $(RESOURCE_GROUP_NAME) --key-type functionKeys --key-name AdoDashboardKey --key-value "$(AdoDashboardKey)"

          # Get Function App Key
          FUNCTION_KEY=$(az rest --method post --uri "https://management.azure.com/subscriptions/$(AZURE_SUBSCRIPTION_ID)/resourceGroups/$(RESOURCE_GROUP_NAME)/providers/Microsoft.Web/sites/${FUNCTION_APP_NAME}/host/default/listKeys?api-version=2022-03-01" --query "functionKeys.default" -o tsv)
          
          export FUNCTION_KEY="$FUNCTION_KEY"
          export ONBOARDING_PAT="${ONBOARDING_PAT:-}"
          export CLAUDE_API_KEY="${CLAUDE_API_KEY:-}"
          export OPENAI_API_KEY="${OPENAI_API_KEY:-}"
          export GITHUB_TOKEN="${GITHUB_TOKEN:-}"
          export COPILOT_ENABLED="${COPILOT_ENABLED:-}"
          export COPILOT_MODE="${COPILOT_MODE:-}"
          export COPILOT_COMPLEXITY_THRESHOLD="${COPILOT_COMPLEXITY_THRESHOLD:-}"
          export COPILOT_CREATE_ISSUE="${COPILOT_CREATE_ISSUE:-}"
          export COPILOT_MODEL="${COPILOT_MODEL:-}"
          export COPILOT_CHECKPOINT_ENFORCEMENT_ENABLED="${COPILOT_CHECKPOINT_ENFORCEMENT_ENABLED:-}"
          export COPILOT_CHECKPOINT_FAIL_HARD="${COPILOT_CHECKPOINT_FAIL_HARD:-}"
          export COPILOT_REQUIRED_ADO_CHECKPOINTS="${COPILOT_REQUIRED_ADO_CHECKPOINTS:-}"
          export GITHUB_BASE_BRANCH="${GITHUB_BASE_BRANCH:-}"
          export COPILOT_WEBHOOK_SECRET="${COPILOT_WEBHOOK_SECRET:-}"
          export REPO_CAPACITY_ENABLED="${REPO_CAPACITY_ENABLED:-}"
          export REPO_CAPACITY_MAX_WORKING_TREE_MB="${REPO_CAPACITY_MAX_WORKING_TREE_MB:-}"
          export REPO_CAPACITY_MAX_BINARY_MB="${REPO_CAPACITY_MAX_BINARY_MB:-}"
          export REPO_CAPACITY_MAX_FILE_COUNT="${REPO_CAPACITY_MAX_FILE_COUNT:-}"
          export REPO_CAPACITY_BLOCK_TRUNCATED_TREE="${REPO_CAPACITY_BLOCK_TRUNCATED_TREE:-}"
          export CODEBASE_API_ONLY_INIT="${CODEBASE_API_ONLY_INIT:-}"
          export CODEBASE_API_FILE_LIMIT_KB="${CODEBASE_API_FILE_LIMIT_KB:-}"
          export CODEBASE_API_PUBLISH_ENABLED="${CODEBASE_API_PUBLISH_ENABLED:-}"
          export MCP_BOOTSTRAP_ENABLED="${MCP_BOOTSTRAP_ENABLED:-}"
          export COPILOT_MCP_AZURE_DEVOPS_PAT="${COPILOT_MCP_AZURE_DEVOPS_PAT:-}"
          
          python scripts/adom8-pipeline-setup.py \
            --subscription-id "$(AZURE_SUBSCRIPTION_ID)" \
            --ado-org "$(AZURE_DEVOPS_ORG)" \
            --ado-project "$(AZURE_DEVOPS_PROJECT)" \
            --github-org "$(GITHUB_ORG)" \
            --github-repo "$(GITHUB_REPO)" \
            --resource-group "$(RESOURCE_GROUP_NAME)" \
            --function-app "${FUNCTION_APP_NAME}" \
            --key-vault "${KEY_VAULT_NAME}" \
            --service-bus-namespace-fqdn "${SERVICE_BUS_NAMESPACE_FQDN}" \
            --service-bus-topic-name "${SERVICE_BUS_TOPIC_NAME}" \
            --service-bus-subscription-name "${SERVICE_BUS_SUBSCRIPTION_NAME}"
      env:
        ONBOARDING_PAT: $(ONBOARDING_PAT)
        CLAUDE_API_KEY: $(CLAUDE_API_KEY)
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        GITHUB_TOKEN: $(GITHUB_TOKEN)
        COPILOT_ENABLED: $(COPILOT_ENABLED)
        COPILOT_MODE: $(COPILOT_MODE)
        COPILOT_COMPLEXITY_THRESHOLD: $(COPILOT_COMPLEXITY_THRESHOLD)
        COPILOT_CREATE_ISSUE: $(COPILOT_CREATE_ISSUE)
        COPILOT_MODEL: $(COPILOT_MODEL)
        COPILOT_CHECKPOINT_ENFORCEMENT_ENABLED: $(COPILOT_CHECKPOINT_ENFORCEMENT_ENABLED)
        COPILOT_CHECKPOINT_FAIL_HARD: $(COPILOT_CHECKPOINT_FAIL_HARD)
        COPILOT_REQUIRED_ADO_CHECKPOINTS: $(COPILOT_REQUIRED_ADO_CHECKPOINTS)
        GITHUB_BASE_BRANCH: $(GITHUB_BASE_BRANCH)
        COPILOT_WEBHOOK_SECRET: $(COPILOT_WEBHOOK_SECRET)
        REPO_CAPACITY_ENABLED: $(REPO_CAPACITY_ENABLED)
        REPO_CAPACITY_MAX_WORKING_TREE_MB: $(REPO_CAPACITY_MAX_WORKING_TREE_MB)
        REPO_CAPACITY_MAX_BINARY_MB: $(REPO_CAPACITY_MAX_BINARY_MB)
        REPO_CAPACITY_MAX_FILE_COUNT: $(REPO_CAPACITY_MAX_FILE_COUNT)
        REPO_CAPACITY_BLOCK_TRUNCATED_TREE: $(REPO_CAPACITY_BLOCK_TRUNCATED_TREE)
        CODEBASE_API_ONLY_INIT: $(CODEBASE_API_ONLY_INIT)
        CODEBASE_API_FILE_LIMIT_KB: $(CODEBASE_API_FILE_LIMIT_KB)
        CODEBASE_API_PUBLISH_ENABLED: $(CODEBASE_API_PUBLISH_ENABLED)
        MCP_BOOTSTRAP_ENABLED: $(MCP_BOOTSTRAP_ENABLED)
        COPILOT_MCP_AZURE_DEVOPS_PAT: $(COPILOT_MCP_AZURE_DEVOPS_PAT)

    - task: AzureCLI@2
      displayName: 'Set GitHub Actions Secrets'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          # Recompute stable resource names (same logic as Stage 1)
          SUFFIX=$(echo -n "$(RESOURCE_GROUP_NAME)" | sha256sum | cut -c1-8)
          ADO_PROJECT_NAME="$(System.TeamProject)"
          if [ -z "$ADO_PROJECT_NAME" ] || [ "$ADO_PROJECT_NAME" = "null" ]; then
            ADO_PROJECT_NAME="$(AZURE_DEVOPS_PROJECT)"
          fi
          PROJECT_SLUG=$(echo "$ADO_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$PROJECT_SLUG" ]; then PROJECT_SLUG="adom8"; fi
          SWA_BASE=$(echo "$PROJECT_SLUG" | cut -c1-35)
          FUNCTION_APP_NAME="adom8-func-${SUFFIX}"
          SWA_NAME="${SWA_BASE}-${SUFFIX}"
          echo "Using ADO-project-derived Static Web App name: $SWA_NAME"

          echo "Fetching Function App publish profile..."
          PUBLISH_PROFILE=$(az functionapp deployment list-publishing-profiles \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$(RESOURCE_GROUP_NAME)" \
            --xml)

          echo "Fetching Static Web App deployment token..."
          SWA_TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$(RESOURCE_GROUP_NAME)" \
            --query "properties.apiKey" -o tsv)

          echo "Writing GitHub Actions secrets to $(GITHUB_ORG)/$(GITHUB_REPO)..."
          set_secret_with_retry() {
            local name="$1"
            local body="$2"
            for attempt in 1 2 3; do
              if gh secret set "$name" --body "$body" --repo "$(GITHUB_ORG)/$(GITHUB_REPO)"; then
                echo "  ✅ $name set"
                return 0
              fi
              echo "  ⚠️  Attempt $attempt failed for $name — waiting 60s before retry..."
              sleep 60
            done
            echo "  ❌ Failed to set $name after 3 attempts (GitHub API rate limit?). Re-run Stage 2 once the rate limit resets."
            return 1
          }

          failed=0
          set_secret_with_retry "AZURE_FUNCTIONAPP_NAME" "$FUNCTION_APP_NAME" || failed=1
          set_secret_with_retry "AZURE_FUNCTIONAPP_PUBLISH_PROFILE" "$PUBLISH_PROFILE" || failed=1
          set_secret_with_retry "AZURE_STATIC_WEB_APPS_API_TOKEN" "$SWA_TOKEN" || failed=1

          EFFECTIVE_MCP_PAT="$(COPILOT_MCP_AZURE_DEVOPS_PAT)"
          if [ -z "$EFFECTIVE_MCP_PAT" ]; then
            EFFECTIVE_MCP_PAT="$(ONBOARDING_PAT)"
            echo "##vso[task.logissue type=warning]COPILOT_MCP_AZURE_DEVOPS_PAT not supplied. Falling back to ONBOARDING_PAT for COPILOT_MCP_AZURE_DEVOPS_PAT secret sync."
          fi
          set_secret_with_retry "COPILOT_MCP_AZURE_DEVOPS_PAT" "$EFFECTIVE_MCP_PAT" || failed=1

          if [ "$failed" = "1" ]; then
            echo "##vso[task.logissue type=warning]One or more GitHub secrets could not be set due to API rate limiting. Re-run this pipeline stage once the rate limit resets (resets hourly). Infrastructure and Function App deployment are unaffected."
          else
            echo "GitHub secrets set successfully — deploy workflows are ready to run."
          fi
      env:
        GH_TOKEN: $(GITHUB_TOKEN)

    - task: AzureCLI@2
      displayName: 'Final Pipeline Summary'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          SUFFIX=$(echo -n "$(RESOURCE_GROUP_NAME)" | sha256sum | cut -c1-8)
          FUNCTION_APP_NAME="adom8-func-${SUFFIX}"
          FUNCTION_URL="https://${FUNCTION_APP_NAME}.azurewebsites.net/api/health"
          ADO_PROJECT_NAME="$(System.TeamProject)"
          if [ -z "$ADO_PROJECT_NAME" ] || [ "$ADO_PROJECT_NAME" = "null" ]; then
            ADO_PROJECT_NAME="$(AZURE_DEVOPS_PROJECT)"
          fi
          PROJECT_SLUG=$(echo "$ADO_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$PROJECT_SLUG" ]; then PROJECT_SLUG="adom8"; fi
          SERVICE_BUS_TOPIC_NAME="adom8-${PROJECT_SLUG}"
          SERVICE_BUS_SUBSCRIPTION_NAME="adom8-agent"
          SERVICE_BUS_NAMESPACE_FQDN="$(SHARED_SERVICE_BUS_NAMESPACE_NAME).servicebus.windows.net"

          APP_STATE=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$(RESOURCE_GROUP_NAME)" --query "state" -o tsv)
          APP_KIND=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$(RESOURCE_GROUP_NAME)" --query "kind" -o tsv)
          IS_LINUX=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$(RESOURCE_GROUP_NAME)" --query "reserved" -o tsv)
          PLAN_ID=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$(RESOURCE_GROUP_NAME)" --query "serverFarmId" -o tsv)
          PLAN_SKU=$(az appservice plan show --ids "$PLAN_ID" --query "sku.tier" -o tsv)
          PLAN_OS=$(az appservice plan show --ids "$PLAN_ID" --query "reserved" -o tsv)
          INDEXED_COUNT=$(az functionapp function list --name "$FUNCTION_APP_NAME" --resource-group "$(RESOURCE_GROUP_NAME)" --query "length(@)" -o tsv || echo "0")
          HEALTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$FUNCTION_URL" || true)

          APP_OS="Windows"
          if [ "$IS_LINUX" = "true" ]; then
            APP_OS="Linux"
          fi

          PLAN_OS_LABEL="Windows"
          if [ "$PLAN_OS" = "true" ]; then
            PLAN_OS_LABEL="Linux"
          fi

          echo ""
          echo "========================================"
          echo "FINAL PIPELINE SUMMARY"
          echo "========================================"
          echo "Function App:      $FUNCTION_APP_NAME"
          echo "Resource Group:    $(RESOURCE_GROUP_NAME)"
          echo "State:             $APP_STATE"
          echo "App OS:            $APP_OS"
          echo "Kind:              $APP_KIND"
          echo "Plan SKU Tier:     $PLAN_SKU"
          echo "Plan OS:           $PLAN_OS_LABEL"
          echo "Indexed Functions: $INDEXED_COUNT"
          echo "Health Endpoint:   $FUNCTION_URL"
          echo "Health HTTP:       $HEALTH_CODE"
          echo "SB Namespace FQDN: $SERVICE_BUS_NAMESPACE_FQDN"
          echo "SB Topic:          $SERVICE_BUS_TOPIC_NAME"
          echo "SB Subscription:   $SERVICE_BUS_SUBSCRIPTION_NAME"
          echo "========================================"
